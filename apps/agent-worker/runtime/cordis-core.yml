# Agent Core: DSH plugins and the session-persistence provider (no HTTP services)
# Loaded by AgentCore class, not directly by the application.

# ── Model ────────────────────────────────────────────────────────────────────
- id: llm
  name: '@deepseek-ai/dsh-llm'

- id: llm-pi-ai
  name: '@deepseek-ai/dsh-llm-pi-ai'
  config:
    providers: !!js JSON.parse(process.env.MODEL_PROVIDERS)

- id: llm-retry
  name: '@deepseek-ai/dsh-llm-retry'

# ── Session log ──────────────────────────────────────────────────────────────
- id: session
  name: '@deepseek-ai/dsh-session'

- id: session-projection
  name: '@deepseek-ai/dsh-session-projection'

- id: database-pg
  name: '../plugins/database-provider-pg/index.ts'
  disabled: !!js process.env.AGENT_DATABASE_PROVIDER !== 'pg'
  config: !!js JSON.parse(process.env.AGENT_DATABASE_CONFIG)

- id: database-mysql
  name: '../plugins/database-provider-mysql/index.ts'
  disabled: !!js process.env.AGENT_DATABASE_PROVIDER !== 'mysql'
  config: !!js JSON.parse(process.env.AGENT_DATABASE_CONFIG)

- id: database-sqlite
  name: '../plugins/database-provider-sqlite/index.ts'
  disabled: !!js process.env.AGENT_DATABASE_PROVIDER !== 'sqlite'
  config: !!js JSON.parse(process.env.AGENT_DATABASE_CONFIG)

- id: session-persistence
  name: '../plugins/session-persistence-database/index.ts'

# ── Agent kernel ─────────────────────────────────────────────────────────────
- id: system-prompt
  name: '@deepseek-ai/dsh-system-prompt'
  config:
    includeHarnessIdentity: false
    includeRuntimeContext: false
    personaPrefix: You are a personal assistant. You can help with information, execute code in a sandbox, and remember important details.

- id: tools
  name: '@deepseek-ai/dsh-tools'

- id: agent
  name: '@deepseek-ai/dsh-agent'
  config:
    emitEvents: true

- id: agent-loop
  name: '@deepseek-ai/dsh-agent-loop'
  config:
    agents: []
    emitEvents: true

# ── Skills ───────────────────────────────────────────────────────────────────
- id: skill
  name: '@deepseek-ai/dsh-skill'

- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
  config:
    includeDefaultRoots: false
    customSkillDirs: !!js "[process.env.AGENT_SKILLS_DIR]"
    watch: false

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'
