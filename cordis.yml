# Minimal embedded DeepSeek Harness tree: agent loop + skills + durable session log.
# No Web, CLI, SDK transport, shell, sandbox, timer, title, or upload plugins.
# main.ts loads .env and sets DSH_HOME and AGENT_SKILLS_DIR before boot().

# ── Model ────────────────────────────────────────────────────────────────────
- id: llm
  name: '@deepseek-ai/dsh-llm'

# dsh's DeepSeek adapter (provider route `deepseek-official`); its default endpoint is
# https://api.deepseek.com/anthropic.
- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek-api-key'
  config:
    apiKeyEnv: MODEL_API_KEY
    baseURL: !!js process.env.MODEL_API_BASE_URL

- id: llm-retry
  name: '@deepseek-ai/dsh-llm-retry'

# ── Session log (the trace source of truth) ───────────────────────────────────
- id: session
  name: '@deepseek-ai/dsh-session'

- id: session-projection
  name: '@deepseek-ai/dsh-session-projection'

- id: session-persistence
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js dshHomePath('sessions')
    compression: none

# ── Agent kernel ─────────────────────────────────────────────────────────────
- id: system-prompt
  name: '@deepseek-ai/dsh-system-prompt'
  config:
    includeHarnessIdentity: false
    includeRuntimeContext: false
    personaPrefix: You are an assistant embedded in a host application. Answer concisely.

- id: tools
  name: '@deepseek-ai/dsh-tools'

- id: agent
  name: '@deepseek-ai/dsh-agent'

# The host creates agents itself through ctx.agents.create().
- id: agent-loop
  name: '@deepseek-ai/dsh-agent-loop'
  config:
    agents: []

# ── Skills ───────────────────────────────────────────────────────────────────
- id: skill
  name: '@deepseek-ai/dsh-skill'

- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
  config:
    includeDefaultRoots: false
    customSkillDirs: !!js "[process.env.AGENT_SKILLS_DIR]"
    watch: false

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'
